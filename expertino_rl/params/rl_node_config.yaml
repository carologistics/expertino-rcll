clips_manager:
  ros__parameters:
    environments: ["expertino_rl"]
    expertino_rl:
        plugins: ["executive",
                  "ament_index",
                  "config",
                  "protobuf",
                  "ros_msgs",
                  "create_rl_env_state",
                  "exec_action_selection",
                  "get_observable_objects",
                  "get_observable_predicates",
                  "get_predefined_observables",
                  "get_action_list",
                  "get_action_list_robot",
                  "set_rl_mode",
                  "get_free_robot",
                  "action_selection",
                  "reset_cx",
                  "plan_temporal_action",
                  "timed_plan_action_msg",
                  "start_refbox",
                  "stop_refbox",
                  "pddl_files",
                  "rl_files",
                  "files"]
        log_clips_to_file: true
        watch: ["facts", "rules"]
        redirect_stdout_to_debug: true

    ament_index:
      plugin: "cx::AmentIndexPlugin"
    
    protobuf:
      plugin: "cx::ProtobufPlugin"
      pkg_share_dirs: ["rcll_protobuf_msgs"]
      proto_paths: ["rcll-protobuf-msgs"]

    config:
      plugin: "cx::ConfigPlugin"

    executive:
      plugin: "cx::ExecutivePlugin"
      publish_on_refresh: false
      assert_time: true
      refresh_rate: 10
    
    create_rl_env_state:
      plugin: "cx::CXCxRlInterfacesCreateRLEnvStatePlugin"

    exec_action_selection:
      plugin: "cx::CXCxRlInterfacesExecActionSelectionPlugin"

    get_observable_objects:
      plugin: "cx::CXCxRlInterfacesGetObservableObjectsPlugin"
    
    get_observable_predicates:
      plugin: "cx::CXCxRlInterfacesGetObservablePredicatesPlugin"

    get_predefined_observables:
      plugin: "cx::CXCxRlInterfacesGetPredefinedObservablesPlugin"

    get_action_list:
      plugin: "cx::CXCxRlInterfacesGetActionListPlugin"

    get_action_list_robot:
      plugin: "cx::CXCxRlInterfacesGetActionListRobotPlugin"

    set_rl_mode:
      plugin: "cx::CXCxRlInterfacesSetRLModePlugin"
      

    get_free_robot:
      plugin: "cx::CXCxRlInterfacesGetFreeRobotPlugin"

    action_selection:
      plugin: "cx::CXCxRlInterfacesActionSelectionPlugin"

    reset_env:
      plugin: "cx::CXCxRlInterfacesResetCXPlugin"

    plan_temporal_action:
      plugin: "cx::CXCxPddlMsgsPlanTemporalPlugin"

    timed_plan_action_msg:
      plugin: "cx::CXCxPddlMsgsTimedPlanActionPlugin"

    start_refbox:
      plugin: "cx::CXExpertinoRlInterfacesStartRefboxPlugin"

    stop_refbox:
      plugin: "cx::CXExpertinoRlInterfacesStopRefboxPlugin"
    
    pddl_files:
      plugin: "cx::FileLoadPlugin"
      pkg_share_dirs: ["cx_pddl_clips", "expertino"]
      batch: [
        "clips/deftemplates.clp",
        "clips/expertino/pddl/deftemplates-overrides.clp",
        "clips/pddl-no-deftemplates.clp"
        ]

    rl_files:
      plugin: "cx::FileLoadPlugin"
      pkg_share_dirs: ["cx_rl_bringup", "cx_rl_clips"]
      batch: [
        "clips/cx_rl_clips/cx-rl.clp",
      ]

    files:
      plugin: "cx::FileLoadPlugin"
      pkg_share_dirs: ["expertino", "expertino_rl"]
      load: [
        # Specific isolated concepts
        "clips/expertino/unwatch.clp",
        "clips/expertino/start-tasks/start-tasks.clp",
        # General utility stuff
        "clips/expertino/defglobals.clp",
        "clips/expertino/deftemplates.clp",
        "clips/expertino/deffunctions.clp",
        # Startup
        "clips/expertino_rl/init-pddl.clp",
        # Actual Reasoning
        "clips/expertino/pddl/plan.clp",
        "clips/expertino/refbox-comm-init.clp",
        "clips/expertino/refbox-recv.clp",
        "clips/expertino/refbox-action.clp",
        "clips/expertino/sim-interface.clp",
        "clips/expertino/orders/order-selection.clp",
        "clips/expertino/action/action-precond-check.clp",
        "clips/expertino/sim-agent-task.clp",
        "clips/expertino/executor.clp",
        "clips/expertino/workers/workers.clp",
        "clips/expertino/production-strategy.clp",
        "clips/expertino_rl/point-mapping.clp",
        "clips/expertino_rl/init.clp",
        "clips/expertino_rl/reset.clp",
        "clips/expertino_rl/action-executability.clp",
        "clips/expertino_rl/action-selection.clp",
        "clips/expertino_rl/action-finalization.clp",
        # Finalize
        "clips/expertino/shutdown/finalize-ros.clp",
        ]
    ros_msgs:
      plugin: "cx::RosMsgsPlugin"


        
