cx_rl_node/expertino_rl_node:
  ros__parameters:
    package_dir: "expertino_ws/src/expertino-rcll/expertino_rl/expertino_rl/"

    agent_name: "ExpertinoAgent"
    rl_mode: "TRAINING"
    number_of_robots: 1

    training:
      retraining: false
      max_episodes: 500
      timesteps: 100000000

    env:
      entrypoint: "expertino_rl.expertino_env:ExpertinoEnv"

    model:
      learning_rate: 0.0003
      gamma: 0.99
      gae_lambda: 0.95
      ent_coef: 0.0
      vf_coef: 0.5
      max_grad_norm: 0.5
      batch_size: 64
      n_steps: 10
      seed: 42
      verbose: 1
      wait_for_all_robots: false

    
    